<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>RedPulseBH – Reset Password</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        :root {
            --rp-primary: #7a0013;
            --rp-primary-dark: #3a0007;
            --rp-accent: #ffc107;
        }

        body {
            background-color: #f5f5f7;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .rp-hero {
            background: linear-gradient(135deg, var(--rp-primary), var(--rp-primary-dark));
            color: #fff;
            padding: 3rem 0;
        }

        .rp-hero h1 {
            font-weight: 700;
        }

        .rp-hero .rp-eyebrow {
            text-transform: uppercase;
            letter-spacing: .15em;
            font-size: .8rem;
            opacity: .8;
        }

        .btn-pill {
            border-radius: 999px;
        }

        .rp-card {
            border-radius: 1.25rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, .08);
            border: none;
        }
    </style>
</head>

<body>


    <section class="rp-hero">
        <div class="container">
            <div class="row">
                <div class="col-lg-7">
                    <div class="rp-eyebrow mb-2">Donor Portal</div>
                    <h1 class="h2 mb-3">Reset Password</h1>
                    <p class="mb-0">
                        Enter your registered email address and choose a new password to regain access
                        to your donor account.
                    </p>
                </div>
            </div>
        </div>
    </section>


    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-4">
                    <div class="card rp-card">
                        <div class="card-body p-4 p-md-4">

                            <h2 class="h4 mb-3 text-center">Reset your password</h2>

                            {% if error %}
                            <div class="alert alert-danger py-2">
                                {{ error }}
                            </div>
                            {% endif %}

                            <form method="post">
                                {% csrf_token %}

                                <div class="mb-3">
                                    <label class="form-label">Email Address</label>
                                    <input type="email" name="email" class="form-control" placeholder="you@example.com"
                                        required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">New Password</label>
                                    <input type="password" name="new_password" class="form-control" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Confirm New Password</label>
                                    <input type="password" name="confirm_password" class="form-control" required>
                                </div>

                                <button type="submit" class="btn btn-danger w-100 btn-pill">
                                    <i class="bi bi-arrow-repeat me-1"></i>
                                    Reset Password
                                </button>
                            </form>

                            <div class="text-center mt-3">
                                <a href="{% url 'donor_login' %}" class="small text-decoration-none">
                                    <i class="bi bi-arrow-left-short"></i>
                                    Back to login
                                </a>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
