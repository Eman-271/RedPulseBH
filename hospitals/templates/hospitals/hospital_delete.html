<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Hospital – RedPulseBH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --rp-primary:#7a0013; }
        .btn-pill { border-radius:999px; }
        .title-bar { background:var(--rp-primary); color:white; padding:1rem 0; }
    </style>
</head>

<body>

<div class="title-bar text-center">
    <h2>Confirm Delete</h2>
</div>

<div class="container py-5 text-center">
    <h4>Are you sure you want to delete:</h4>
    <h3 class="text-danger">{{ hospital.name }}</h3>

    <p>This action cannot be undone.</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger btn-pill">Yes, Delete</button>
        <a href="{% url 'hospital_list' %}" class="btn btn-outline-dark btn-pill">Cancel</a>
    </form>
</div>

</body>
</html>
