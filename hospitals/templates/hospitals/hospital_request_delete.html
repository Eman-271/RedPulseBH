{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Delete Request – {{ hospital.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 600px;">
            <div class="card-body">
                <h4 class="text-danger mb-3">Delete blood request</h4>

                <p>
                    Are you sure you want to permanently delete this blood request?
                </p>

                <div class="mb-3">
                    <strong>{{ blood_request.title }}</strong><br>
                    <small class="text-muted">
                        {{ blood_request.blood_type_needed }} · {{ blood_request.units }} units
                    </small>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'hospital_request_update' blood_request.id %}" class="btn btn-secondary">
                            Cancel
                        </a>

                        <button type="submit" class="btn btn-danger">
                            Delete request
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>

</html>
