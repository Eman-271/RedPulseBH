{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>View / Update Request – {{ hospital.name }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --rp-primary: #7a0013;
            --rp-primary-dark: #3a0007;
            --rp-accent: #ffc107;
        }

        body {
            background-color: #f5f5f7;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .navbar {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: .5px;
        }

        .page-header {
            background: radial-gradient(circle at top left, #9c0020, var(--rp-primary-dark));
            color: #fff;
            padding: 2rem 0 2.3rem;
            margin-bottom: 2rem;
        }

        .btn-pill {
            border-radius: 999px;
            padding-inline: 1.3rem;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">RedPulseBH</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div id="nav" class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'hospital_dashboard' %}">Hospital Dashboard</a>
                </li>
                <li class="nav-item ms-lg-2">
                    <a class="btn btn-danger btn-sm btn-pill" href="{% url 'hospital_logout' %}">
                        <i class="bi bi-box-arrow-right me-1"></i> Logout
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<header class="page-header">
    <div class="container">
        <h1 class="h4 mb-1">View / update blood request</h1>
        <p class="mb-0">
            {{ hospital.name }} · {{ hospital.city_area }}
        </p>
    </div>
</header>

<main class="pb-5">
    <div class="container">

        <div class="card shadow-sm">
            <div class="card-body">
                <form method="post" class="row g-3">
                    {% csrf_token %}

                    <div class="col-md-8">
                        <label class="form-label">Request title</label>
                        <input type="text" name="title" class="form-control"
                               value="{{ form_data.title|default_if_none:'' }}" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Blood type</label>
                        <select name="blood_type" class="form-select" required>
                            <option value="" disabled {% if not form_data.blood_type %}selected{% endif %}>
                                Select
                            </option>
                            {% for bt in blood_types %}
                                <option value="{{ bt }}" {% if form_data.blood_type == bt %}selected{% endif %}>
                                    {{ bt }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Requested units</label>
                        <input type="number" min="1" name="units" class="form-control"
                               value="{{ form_data.units|default_if_none:'' }}" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Urgency</label>
                        <select name="urgency" class="form-select" required>
                            <option value="" disabled {% if not form_data.urgency %}selected{% endif %}>
                                Select
                            </option>
                            {% for u in urgency_choices %}
                                <option value="{{ u }}" {% if form_data.urgency == u %}selected{% endif %}>
                                    {{ u }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select" required>
                            <option value="open" {% if form_data.status == "open" %}selected{% endif %}>Open</option>
                            <option value="closed" {% if form_data.status == "closed" %}selected{% endif %}>Closed</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Clinical notes for the blood bank</label>
                        <textarea name="notes" rows="4"
                                  class="form-control">{{ form_data.notes|default_if_none:'' }}</textarea>
                    </div>

                    <div class="col-12 d-flex justify-content-between align-items-center mt-2">
                        <a href="{% url 'hospital_dashboard' %}" class="btn btn-outline-secondary btn-pill">
                            <i class="bi bi-arrow-left me-1"></i> Back
                        </a>

                        <div class="d-flex gap-2">
                            <a href="{% url 'hospital_request_delete' blood_request.id %}"
                               class="btn btn-outline-danger btn-pill">
                                <i class="bi bi-trash me-1"></i> Delete
                            </a>

                            <button type="submit" class="btn btn-danger btn-pill">
                                <i class="bi bi-check-circle me-1"></i> Save changes
                            </button>
                        </div>
                    </div>

                </form>
            </div>
        </div>

    </div>
</main>

<footer class="mt-4 py-3 bg-dark text-light">
    <div class="container text-center">
        <small>&copy; 2025 RedPulseBH · Hospital Portal</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
